
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Responsive image slider using vanilla JavaScript">
    <title>Image Slider Library</title>
    <link rel="stylesheet" href="style.css">
    <script src="slider.js" defer></script>
</head>
<body>
    <main class="page">
        <header class="page-header">
            <p class="eyebrow">Vanilla JavaScript Project</p>
            <h1>Image Slider Library</h1>
            <p class="intro">
                Explore a responsive image slider with smooth animations
                and infinite navigation.
            </p>
        </header>

        <section class="slider" aria-label="Image slider">
            <div class="slider__viewport">
                <div class="slider__track">

                    <figure class="slider__slide">
                        <img
                            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=85"
                            alt="Sunlight over a beautiful mountain landscape">
                        <figcaption class="slide-caption">
                            <span>01 / Explore</span>
                            <h2>Find Your Next Adventure</h2>
                        </figcaption>
                    </figure>

                    <figure class="slider__slide">
                        <img
                            src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1600&q=85"
                            alt="A peaceful lake surrounded by mountains">
                        <figcaption class="slide-caption">
                            <span>02 / Relax</span>
                            <h2>Make Room for Calm</h2>
                        </figcaption>
                    </figure>

                    <figure class="slider__slide">
                        <img
                            src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=85"
                            alt="Tall mountain peaks beneath a cloudy sky">
                        <figcaption class="slide-caption">
                            <span>03 / Discover</span>
                            <h2>See the World Differently</h2>
                        </figcaption>
                    </figure>

                    <figure class="slider__slide">
                        <img
                            src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1600&q=85"
                            alt="Sunbeams shining through a green forest">
                        <figcaption class="slide-caption">
                            <span>04 / Breathe</span>
                            <h2>Reconnect With Nature</h2>
                        </figcaption>
                    </figure>

                </div>
            </div>

            <button
                class="slider__arrow slider__arrow--previous"
                type="button"
                aria-label="Previous image">
                &#10094;
            </button>

            <button
                class="slider__arrow slider__arrow--next"
                type="button"
                aria-label="Next image">
                &#10095;
            </button>

            <div class="slider__footer">
                <p class="slider__counter" aria-live="polite">01 / 04</p>
                <div class="slider__dots" aria-label="Choose an image"></div>
                <p class="slider__hint">Use arrows or dots to navigate</p>
            </div>
        </section>

        <footer class="page-note">
            <p>Built with HTML5, CSS3, and vanilla JavaScript.</p>
        </footer>
    </main>
</body>
</html>
